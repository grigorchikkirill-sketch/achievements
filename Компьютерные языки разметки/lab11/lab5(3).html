<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style5(3).css" rel="stylesheet" media="all">
    <title>Форма</title>
</head>

<body>
    <form>
        <p>Регистрация постоянного клиента</p>
        <p><label for="fam" class="label"> Фамилия:</label>
            <input type="text" id="fam" />
        </p>
        <p><label for="im" class="label"> Имя:</label>
            <input type="text" id="im" />
        </p>
        <p><label for="ot" class="label"> Отчество:</label>
            <input type="text" id="ot" />
        </p>
        <p><label for="vosr" class="label"> Ваш возраст:</label>
            <input type="text" id="vosr" />
        </p>
        <p>
            <span> Пол:</span>
            <input type="checkbox" id="pol_m" /> <label for="pol_m"> мужской </label> <input type="checkbox"
                id="pol_j" />
            <label for="pol_j"> женский </label>
        </p>
        <p><label for="em" class="label"> Email:</label>
            <input type="email" id="em" />
        </p>
        <p><label for="str" class="label"> Страна проживания:</label>
            <input type="text" id="str" />
        </p>
        <p><label for="vopr" class="label"> Откуда вы узнали о нас?</label>
            <select id="vopr">
                <option value="null">Выберите вариант</option>
                <option value="1">ЭЭЭЭЭ</option>
                <option value="2">эээ</option>
                <option value="3">мммм</option>
                <option value="4">можно повторить вопрос...</option>
            </select>
        </p>
        <p><label for="date" class="label"> Дата заполнения:</label>
            <input type="date" id="date" />
        </p>
        <p><input type="button" value="Регистрация" class="button1" /><input type="button" value="Отмена"
                class="button2" />
        </p>

    </form>

</body>

</html>
